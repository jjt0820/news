<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ subtitle or "오늘의 뉴스" }}</title>
</head>
<body style="margin:0;padding:0;background:#06070b;color:#f2f3f5;font-family:Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif;">
    <div style="max-width:760px;margin:0 auto;padding:36px 18px 28px 18px;">
        <p style="margin:0 0 10px 0;color:#8a8f98;font-size:22px;letter-spacing:-0.2px;">
            {{ subtitle or "오늘의 뉴스" }}
        </p>
        <h1 style="margin:0 0 22px 0;line-height:1.25;color:#f7f2e8;font-size:48px;font-weight:700;letter-spacing:-1px;white-space:pre-line;">
            {{ title or "좋은 아침이에요,\n큐레이션 뉴스가 도착했어요" }}
        </h1>

        {% if categories %}
        <div style="margin:0 0 20px 0;">
            {% for category in categories %}
            <span style="display:inline-block;margin:0 8px 8px 0;padding:10px 16px;border:1px solid #2a2d33;border-radius:999px;background:#111318;color:#d7d9dd;font-size:22px;">
                {{ category }}
            </span>
            {% endfor %}
        </div>
        {% endif %}

        {% for item in news_cards %}
        <div style="background:#111318;border:1px solid #2a2d33;border-radius:22px;padding:24px;margin-bottom:16px;">
            <p style="margin:0 0 14px 0;color:#d5ad63;font-size:34px;font-weight:700;">
                {{ item.source }}
                <span style="color:#5f6773;font-size:28px;font-weight:500;">&nbsp;&bull;&nbsp;{{ item.time }}</span>
            </p>
            <h2 style="margin:0 0 14px 0;color:#f8f0e2;font-size:42px;line-height:1.3;font-weight:700;letter-spacing:-0.6px;">
                {{ item.title }}
            </h2>
            <p style="margin:0;color:#8e949e;font-size:31px;line-height:1.5;">
                {{ item.summary }}
            </p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
