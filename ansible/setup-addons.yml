- name: EKS 필수 Helm Addons 구성 및 설치
  hosts: eks
  vars:
    eks_cluster: patrasche-news
    namespace: kube-system
    aws_region: ap-northeast-2

  tasks:
    - name: kubeconfig 업데이트
      shell: |
        aws eks update-kubeconfig \
          --name {{ eks_cluster }} \
          --region {{ aws_region }}

    - name: Helm 공식 Chart 레포지토리 추가 및 갱신
      shell: |
        helm repo add external-secrets https://charts.external-secrets.io
        helm repo add eks https://aws.github.io/eks-charts
        helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
        helm repo update

    - name: External Secrets Operator 설치
      shell: |
        helm upgrade --install external-secrets external-secrets/external-secrets \
          --namespace external-secrets \
          --create-namespace \
          --set installCRDs=true \
          --wait --timeout 180s

    - name: AWS Load Balancer Controller 설치
      shell: |
        helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
          --namespace {{ namespace }} \
          --set clusterName={{ eks_cluster }} \
          --set serviceAccount.create=true \
          --set serviceAccount.name=aws-load-balancer-controller \
          --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="{{ alb_controller_role_arn }}" \
          --wait --timeout 180s

    - name: External DNS 설치
      shell: |
        helm upgrade --install external-dns external-dns/external-dns \
          --namespace {{ namespace }} \
          --set provider=aws \
          --set txtOwnerId={{ eks_cluster }} \
          --set serviceAccount.create=true \
          --set serviceAccount.name=external-dns \
          --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="{{ external_dns_role_arn }}" \
          --wait --timeout 180s