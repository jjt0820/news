---
- name: EKS 필수 Helm Addons 구성 및 설치
  hosts: eks
  vars:
    eks_cluster: patrasche-news
    namespace: kube-system
    aws_region: ap-northeast-2

  tasks:
    - name: 필수 변수 확인
      ansible.builtin.assert:
        that:
          - alb_controller_role_arn is defined
          - alb_controller_role_arn | length > 0
          - external_dns_role_arn is defined
          - external_dns_role_arn | length > 0
          - target_vpc_id is defined
          - target_vpc_id | length > 0
        fail_msg: "alb_controller_role_arn, external_dns_role_arn, target_vpc_id 변수가 필요합니다."

    - name: kubeconfig 업데이트
      ansible.builtin.shell: |
        aws eks update-kubeconfig \
          --name {{ eks_cluster }} \
          --region {{ aws_region }}
      changed_when: false

    - name: Helm 공식 Chart 레포지토리 추가 및 갱신
      ansible.builtin.shell: |
        helm repo add external-secrets https://charts.external-secrets.io || true
        helm repo add eks https://aws.github.io/eks-charts || true
        helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/ || true
        helm repo update
      changed_when: false

    - name: External Secrets Operator 설치
      ansible.builtin.shell: |
        helm upgrade --install external-secrets external-secrets/external-secrets \
          --namespace external-secrets \
          --create-namespace \
          --set installCRDs=true \
          --wait --timeout 180s
      changed_when: true

    - name: AWS Load Balancer Controller 설치
      ansible.builtin.shell: |
        helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
          --namespace {{ namespace }} \
          --set clusterName={{ eks_cluster }} \
          --set region={{ aws_region }} \
          --set vpcId={{ target_vpc_id }} \
          --set serviceAccount.create=true \
          --set serviceAccount.name=aws-load-balancer-controller \
          --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="{{ alb_controller_role_arn }}" \
          --wait --timeout 180s
      changed_when: true

    - name: External DNS 설치
      ansible.builtin.shell: |
        helm upgrade --install external-dns external-dns/external-dns \
          --namespace {{ namespace }} \
          --set provider=aws \
          --set txtOwnerId={{ eks_cluster }} \
          --set serviceAccount.create=true \
          --set serviceAccount.name=external-dns \
          --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="{{ external_dns_role_arn }}" \
          --set env[0].name=AWS_DEFAULT_REGION \
          --set env[0].value={{ aws_region }} \
          --wait --timeout 180s
      changed_when: true


    - name: AWS Load Balancer Controller 삭제 후 재설치
      ansible.builtin.shell: |
        helm uninstall aws-load-balancer-controller -n kube-system || true
        kubectl delete secret -n kube-system \
          -l app.kubernetes.io/name=aws-load-balancer-controller || true
        sleep 10
        helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
          --namespace {{ namespace }} \
          --set clusterName={{ eks_cluster }} \
          --set region={{ aws_region }} \
          --set vpcId={{ target_vpc_id }} \
          --set serviceAccount.create=true \
          --set serviceAccount.name=aws-load-balancer-controller \
          --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="{{ alb_controller_role_arn }}" \
          --wait --timeout 180s
      changed_when: true