name: Backend CI/CD Pipeline

# 트리거: main 브랜치 backend 폴더 변경 시에만 실행
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
# ────────────────────────────────────
# JOB 1: CI (린트 + 테스트 + 빌드)
# ────────────────────────────────────
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks 보안 스캔
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy 보안 스캔
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install -r backend/mail-service/requirements.txt
          pip install -r backend/news-service/requirements.txt
          pip install -r backend/user-service/requirements.txt
          pip install flake8 pytest

      - name: 린트 검사 (flake8)
        run: |
          flake8 backend/mail-service --max-line-length=100 --exclude=__pycache__
          flake8 backend/news-service --max-line-length=100 --exclude=__pycache__
          flake8 backend/user-service --max-line-length=100 --exclude=__pycache__

      - name: 테스트 실행 (pytest)
        run: |
           pytest backend/mail-service/tests/ -v
           pytest backend/news-service/tests/ -v
           pytest backend/user-service/tests/ -v


      - name: 도커 빌드 확인
        run: |
            docker build -t patrasche-notifier:test ./backend/mail-service
            docker build -t patrasche-crawler:test ./backend/news-service
            docker build -t patrasche-backend:test ./backend/user-service

# ────────────────────────────────────
# JOB 2: ECR 푸시 (CI 통과 후 실행)
# ────────────────────────────────────
  push-ecr:
    runs-on: ubuntu-latest
    needs: ci
    # 팀원한테 정보 받으면 아래 if 제거
    if: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: ECR 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 & ECR 푸시
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/patrasche-notifier:$IMAGE_TAG ./backend/mail-service
          docker push $ECR_REGISTRY/patrasche-notifier:$IMAGE_TAG
        
          docker build -t $ECR_REGISTRY/patrasche-crawler:$IMAGE_TAG ./backend/news-service
          docker push $ECR_REGISTRY/patrasche-crawler:$IMAGE_TAG
          
          docker build -t $ECR_REGISTRY/patrasche-analyzer:$IMAGE_TAG ./backend/news-service
          docker push $ECR_REGISTRY/patrasche-analyzer:$IMAGE_TAG

          docker build -t $ECR_REGISTRY/patrasche-backend:$IMAGE_TAG ./backend/user-service
          docker push $ECR_REGISTRY/patrasche-backend:$IMAGE_TAG
# ────────────────────────────────────
# JOB 3: EKS 배포 (ECR 푸시 후 실행)
# ────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: push-ecr
    # 팀원한테 정보 받으면 아래 if 제거
    if: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: kubeconfig 업데이트
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME }} \
            --region ap-northeast-2

      - name: kubectl 설치
        uses: azure/setup-kubectl@v3

      - name: EKS 파드 이미지 업데이트
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image cronjob/crawler-cronjob \
           crawler=$ECR_REGISTRY/patrasche-crawler:$IMAGE_TAG \
           -n news-app-ns

          kubectl set image deployment/analyzer-deployment \
           analyzer=$ECR_REGISTRY/patrasche-analyzer:$IMAGE_TAG \
           -n news-app-ns

          kubectl set image deployment/notifier-deployment \
            notifier=$ECR_REGISTRY/patrasche-notifier:$IMAGE_TAG \
            -n news-app-ns

          kubectl set image deployment/webserving-deployment \
            backend=$ECR_REGISTRY/patrasche-backend:$IMAGE_TAG \
            -n news-app-ns

         

# ────────────────────────────────────
# JOB 4: Slack 알림 (항상 실행)
# ────────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: [ci, push-ecr, deploy]
    if: always()

    steps:
      - name: 배포 성공 알림
        if: ${{ needs.ci.result == 'success' }}
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          -d '{
            "text": "✅ *[news-crawler-backend]* 빌드 완료!\n커밋: ${{ github.sha }}\n작업자: ${{ github.actor }}"
          }'

      - name: 배포 실패 알림
        if: ${{ needs.ci.result == 'failure' }}
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          -d '{
            "text": "❌ *[news-crawler-backend]* 빌드 실패!\n작업자: ${{ github.actor }}\n확인: ${{ github.server_url }}/${{ github.repository }}/actions"
          }' 